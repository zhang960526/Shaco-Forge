<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    />
    <title>Shaco Forge</title>
    <script src="./static/shell-bootstrap.js"></script>
    <script src="./static/boot-facade.js"></script>
    <script src="./static/bootstrap.js"></script>
  </head>
  <body>
    <div class="app-shell" data-shaco-shell>
      <aside class="sidebar" aria-label="Shaco Forge 导航">
        <header class="brand">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span><strong>Shaco Forge</strong><small>AI 开发工作空间</small></span>
        </header>
        <section class="sidebar-section" aria-labelledby="functions-heading">
          <h2 id="functions-heading">功能</h2>
          <button class="nav-action" data-testid="new-chat" type="button" disabled title="请在内嵌 Harness 中新建会话">
            <span aria-hidden="true">＋</span> 新对话
          </button>
        </section>
        <section class="sidebar-section project-directory" aria-labelledby="projects-heading">
          <h2 id="projects-heading">项目目录</h2>
          <div class="empty-directory" data-testid="project-directory">项目与会话由内嵌 Harness 管理</div>
          <p>请使用右侧 Harness 的工作区与会话导航。</p>
        </section>
        <button class="settings-entry" data-testid="settings" type="button" disabled title="请使用内嵌 Harness 的设置">设置 · 在 Harness 中管理</button>
      </aside>
      <main class="workspace">
        <header class="workspace-header centered-content">
          <div>
            <p class="eyebrow">REAL HARNESS CLIENT</p>
            <h1>对话工作区</h1>
          </div>
          <output class="connection-status" data-testid="connection-status" aria-live="polite">Worker Starting</output>
        </header>
        <section class="client-stage centered-content" aria-label="Harness Client">
          <div class="truthful-state" data-testid="truthful-state">
            <strong>正在启动 Harness</strong>
            <span>工作区、会话和设置由内嵌 Harness 呈现。</span>
          </div>
          <div id="harness-client-root" data-harness-client-mount></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/renderer/main.ts"></script>
  </body>
</html>
